name: Vibe Doctor CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test-and-self-audit:
    name: Build, Test & Architecture Self-Audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build CLI distribution
        run: npm run build

      - name: Run unit & benchmark test suite
        run: npm test

      - name: Dogfood Vibe Doctor strict architecture audit
        run: node bin/vibe-doctor.js audit --strict --no-ai
